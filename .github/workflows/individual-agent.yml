name: Individual agent worker

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openuem_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: openuem_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openuem_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENT_ENROLLMENT_TEST_DATABASE_URL: postgres://openuem_test:local-test-only@127.0.0.1:5432/openuem_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Body binding, profile scope, persistence and real broker
        run: go test -race -count=1 ./internal/common ./internal/models ./internal/commands
      - name: Actual worker command with protected database and encryption files
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/openuem-worker" .
          OPENUEM_WORKER_TEST_BINARY="$RUNNER_TEMP/openuem-worker" go test -count=1 -run '^TestIndividualWorkerRejectsForgedBodiesRepliesAndRevokedSenders$' ./internal/common
  windows-credentials:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Native protected file inputs and legacy configuration separation
        run: go test -count=1 -run '^Test(IndividualService|AgentCLI)' ./internal/common ./internal/commands
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: '0'
